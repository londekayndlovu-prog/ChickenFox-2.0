<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chicken Fox</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CFEBFF">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#CFEBFF;--card:#FFFFFF;--cell:#EAF6FF;--trail:#FF8A5B;--dot:#FFD23F;--done:#4CC38A;--ink:#3B2A5C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2547;--card:#2C3363;--cell:#3B4380;--ink:#FFF4D6}}
:root[data-theme="dark"]{--bg:#1F2547;--card:#2C3363;--cell:#3B4380;--ink:#FFF4D6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",sans-serif;
display:flex;justify-content:center;padding:18px 14px;user-select:none;-webkit-user-select:none}
section{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
h1{margin:0;font-size:2.2rem;font-weight:700}
p{margin:0;font-size:1.15rem;text-align:center;max-width:22em}
#stars{font-size:1.8rem;letter-spacing:.2em;min-height:2.2rem}
#board{position:relative;width:min(92vw,420px);aspect-ratio:1;background:var(--card);border-radius:28px;padding:10px;touch-action:none;box-shadow:0 6px 0 rgba(59,42,92,.18)}
#grid{position:absolute;inset:10px;display:grid;gap:6px}
.cell{background:var(--cell);border-radius:18px;transition:background .15s}
.cell.on{background:#FFE3D6}
.layer{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);pointer-events:none}
#head{z-index:3}
.dot{position:absolute;display:grid;place-items:center;border-radius:50%;background:var(--dot);color:#3B2A5C;font-weight:700;pointer-events:none;transform:translate(-50%,-50%);transition:background .2s}
.dot.hit{background:var(--done);color:#fff}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
button{font:inherit;font-weight:700;font-size:1.2rem;border:0;border-radius:999px;padding:12px 24px;background:var(--trail);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(59,42,92,.25)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(59,42,92,.25)}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.big{display:flex;flex-direction:column;align-items:center;gap:2px;width:min(80vw,280px);padding:18px;font-size:1.6rem;border-radius:36px}
.big span{font-size:4.2rem;line-height:1.1}
.big[data-t=big]{background:var(--done)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row button{font-size:1.05rem;padding:10px 18px}
.row .alt{background:var(--ink);color:var(--bg)}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(207,235,255,.88);z-index:5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #win{background:rgba(31,37,71,.9)}}
:root[data-theme="dark"] #win{background:rgba(31,37,71,.9)}
#win.show{display:flex}
#win h2{margin:0;font-size:3rem}
.pop{position:fixed;top:-40px;font-size:2rem;animation:fall linear forwards;pointer-events:none;z-index:6}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s!important}.cell{transition:none}}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:4;padding:8px 14px;font-size:1.1rem}
button.alt,#mute{background:var(--ink);color:var(--bg)}
.big[data-g=shapes]{background:var(--dot);color:#3B2A5C}
.big[data-g=dots]{background:var(--trail)}
#stars2{font-size:1.8rem;letter-spacing:.2em;min-height:2.2rem}
#targets,#tray{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}
#tray{margin-top:26px;min-height:calc(var(--sz,100px) + 10px)}
.slot,.piece{width:var(--sz,100px);height:var(--sz,100px);color:var(--ink)}
.slot{background:var(--card);border-radius:22px;padding:8px;box-shadow:0 4px 0 rgba(59,42,92,.15)}
.piece{touch-action:none;cursor:grab;position:relative;filter:drop-shadow(0 4px 0 rgba(59,42,92,.2))}
.piece svg{pointer-events:none}
#menu .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(92vw,420px)}
.big.gm{width:100%;font-size:1.25rem;padding:14px 8px;border-radius:28px}
.big.gm span{font-size:3rem}
.big[data-g=sort]{background:#4DA3FF}
.big[data-g=count]{background:#FF8FD0;color:#3B2A5C}
.slot.bk{background:var(--c);height:calc(var(--sz,100px)*1.25);display:flex;flex-direction:column;align-items:center;padding:6px;color:#fff}
.bl{font-size:1.15rem;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.in{display:flex;flex-wrap:wrap;justify-content:center;font-size:1.4rem;line-height:1.1}
.piece.em{display:grid;place-items:center;font-size:calc(var(--psz,70px)*.75);line-height:1;filter:none;width:var(--psz,70px);height:var(--psz,70px)}
#cstars{font-size:1.8rem;letter-spacing:.2em;min-height:2.2rem}
#cbox{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center;background:var(--card);border-radius:28px;padding:16px;width:min(92vw,420px);min-height:170px;box-shadow:0 6px 0 rgba(59,42,92,.18)}
.ci{background:none;box-shadow:none;color:inherit;padding:2px 6px;line-height:1.1;border-radius:16px;transition:opacity .2s,transform .2s}
.ci.on{opacity:.35;transform:scale(.85)}
#cans button{min-width:84px;font-size:2.2rem;background:var(--dot);color:#3B2A5C;padding:10px 20px}
#cans button.no{opacity:.3}
#cans button.yes{background:var(--done);color:#fff}
#vw{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg);border-radius:20px;padding:12px 16px;font-size:1rem;text-align:center}
</style>
</head>
<body>
<button id="mute" aria-label="Sound is on">🔊</button>
<div id="vw" hidden></div>
<section id="home">
<h1>🐥 Chicken Fox 🦊</h1>
<p>Who is playing?</p>
<button class="big" data-t="little"><span>🐣</span>Ages 2-3</button>
<button class="big" data-t="big"><span>🦊</span>Ages 4-6</button>
<button id="test" class="alt">🗣 Test voice</button>
</section>
<section id="menu" hidden>
<h1>Pick a game</h1>
<div class="grid">
<button class="big gm" data-g="dots"><span>🐾</span>Dot Trail</button>
<button class="big gm" data-g="shapes"><span>🔷</span>Shape Match</button>
<button class="big gm" data-g="sort"><span>🎨</span>Color Sort</button>
<button class="big gm" data-g="count"><span>🔢</span>Counting</button>
</div>
<button id="menu-home" class="alt">🏠 Home</button>
</section>
<section id="shapes" hidden>
<p id="sp">Drag each shape to its home!</p>
<div id="stars2" aria-live="polite"></div>
<div id="targets"></div>
<div id="tray"></div>
<div class="row"><button id="s-home" class="alt">🏠 Home</button><button id="s-reset">↺ Again</button></div>
</section>
<section id="count" hidden>
<p id="cq"></p>
<div id="cstars" aria-live="polite"></div>
<div id="cbox"></div>
<div class="row" id="cans"></div>
<div class="row"><button id="c-home" class="alt">🏠 Home</button></div>
</section>
<section id="play" hidden>
<p id="tip"></p>
<div id="stars" aria-live="polite"></div>
<div id="board"><div id="grid"></div><svg id="trail" class="layer"></svg><svg id="head" class="layer"></svg></div>
<div class="row">
<button id="home-btn" class="alt">🏠 Home</button>
<button id="reset">↺ Try again</button>
<button id="hint" hidden>💡 Hint</button>
</div>
</section>
<div id="win" role="dialog" aria-label="You did it"><h2>Hooray!</h2><div style="font-size:4rem">🎉</div><button id="next">Next</button></div>
<script>
const snake=n=>{const p=[];for(let r=0;r<n;r++)for(let k=0;k<n;k++)p.push([r,r%2?n-1-k:k]);return p};
const T=p=>p.map(([r,c])=>[c,r]);
const spiral=n=>{const p=[];let t=0,b=n-1,l=0,R=n-1;while(t<=b&&l<=R){for(let c=l;c<=R;c++)p.push([t,c]);t++;for(let r=t;r<=b;r++)p.push([r,R]);R--;
if(t<=b){for(let c=R;c>=l;c--)p.push([b,c]);b--}if(l<=R){for(let r=b;r>=t;r--)p.push([r,l]);l++}}return p};
const TRACKS={
little:[
{n:2,p:snake(2),w:[0,3],lab:'num'},
{n:3,p:snake(3),w:[0,4,8],lab:'num'},
{n:3,p:spiral(3),w:[0,5,8],lab:'num'},
{n:3,p:T(snake(3)),w:[0,4,8],lab:'num'}],
big:[
{n:4,p:T(snake(4)),w:[0,5,10,15],lab:'num'},
{n:4,p:spiral(4),w:[0,6,11,15],lab:'num'},
{n:5,p:snake(5),w:[0,6,12,18,24],lab:'abc'},
{n:5,p:spiral(5),w:[0,8,16,20,24],lab:'abc'}]};
const TIPS={little:'Connect the numbers in order: 1, 2, 3! Fill every square.',big:'Help the fox visit each dot in order. Fill every square!'};
const $=id=>document.getElementById(id);
const board=$('board'),grid=$('grid'),trail=$('trail'),head=$('head');
let track,lv=0,cur,n,wp,total,path=[],drag=false,done=false,hint=null,ac,mode='dots';
let muted=false;
function tone(f,d=.18,type='sine',v=.08,delay=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();if(muted)return;
const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={
step:()=>tone(380+path.length*35,.12,'triangle'),
dot:()=>{tone(784,.15);tone(1047,.25,'sine',.08,.1)},
back:()=>tone(260,.1,'triangle'),
bad:()=>tone(150,.25,'sawtooth',.05),
tap:()=>tone(600,.08,'square',.04),
win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'sine',.08,i*.14))};
const SAY={'🍎':'apple','🌞':'sun','🐟':'fish','🍓':'strawberry','🐸':'frog','⭐':'star','🍌':'banana','🐢':'turtle','🌈':'rainbow'};
let VO=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();VO=v.find(x=>/^en/i.test(x.lang)&&/female|samantha|google us|zira|karen/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(t){if(muted||!t||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(String(t));u.lang='en-US';if(VO)u.voice=VO;u.rate=.8;u.pitch=1.3;u.volume=1;u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')warnVoice()};speechSynthesis.speak(u);setTimeout(()=>{if(!speechSynthesis.getVoices().length)warnVoice()},1500)}catch(e){warnVoice()}}
function warnVoice(){const v=document.getElementById('vw');if(v){v.textContent='No voice found on this phone or browser. Open this page in Chrome. Tap to close.';v.hidden=false}}
const label=k=>cur.lab==='num'?k:cur.lab==='abc'?String.fromCharCode(64+k):cur.lab[k-1];
const spoken=k=>{const l=label(k);return SAY[l]||String(l)};
function start(t){mode='dots';$('menu').hidden=true;track=t;$('home').hidden=true;$('play').hidden=false;$('tip').textContent=TIPS[t];$('hint').hidden=t!=='big';load(0)}
function home(){$('win').classList.remove('show');$('play').hidden=true;$('menu').hidden=true;$('shapes').hidden=true;$('count').hidden=true;$('home').hidden=false}
function load(i){
lv=i;cur=TRACKS[track][i];n=cur.n;wp={};done=false;path=[];hint=null;
cur.w.forEach((idx,k)=>{const[r,c]=cur.p[idx];wp[r*n+c]=k+1});
total=cur.w.length;
grid.style.gridTemplateColumns=`repeat(${n},1fr)`;grid.style.gridTemplateRows=`repeat(${n},1fr)`;
grid.innerHTML='';board.querySelectorAll('.dot').forEach(d=>d.remove());
for(let k=0;k<n*n;k++){const d=document.createElement('div');d.className='cell';grid.appendChild(d)}
Object.keys(wp).forEach(k=>{const r=Math.floor(k/n),c=k%n,d=document.createElement('div'),s=50/n;
d.className='dot';d.id='d'+k;d.textContent=label(wp[k]);
d.style.cssText=`left:calc(10px + (100% - 20px) * ${(c+.5)/n});top:calc(10px + (100% - 20px) * ${(r+.5)/n});width:${s*1.1}%;height:${s*1.1}%;font-size:${track==='little'?(n>2?2.4:3):(n>4?1.5:1.9)}rem`;
board.appendChild(d)});
draw();
}
function visited(){return path.filter(([r,c])=>wp[r*n+c]).length}
function draw(){
const cells=grid.children,u=100;
for(let k=0;k<cells.length;k++)cells[k].classList.remove('on');
path.forEach(([r,c])=>cells[r*n+c].classList.add('on'));
board.querySelectorAll('.dot').forEach(d=>d.classList.remove('hit'));
path.forEach(([r,c])=>{const d=$('d'+(r*n+c));if(d)d.classList.add('hit')});
const vb=`0 0 ${n*u} ${n*u}`;trail.setAttribute('viewBox',vb);head.setAttribute('viewBox',vb);
const pts=path.map(([r,c])=>`${c*u+u/2},${r*u+u/2}`).join(' ');
trail.innerHTML=path.length>1?`<polyline points="${pts}" fill="none" stroke="var(--trail)" stroke-width="${n>3?28:34}" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`:'';
let h='';
if(hint)h+=`<circle cx="${hint[1]*u+u/2}" cy="${hint[0]*u+u/2}" r="34" fill="none" stroke="var(--done)" stroke-width="8"><animate attributeName="r" values="28;44;28" dur="1s" repeatCount="indefinite"/></circle>`;
const[r,c]=path.length?path[path.length-1]:cur.p[0];
h+=`<text x="${c*u+u/2}" y="${r*u+u/2}" font-size="${n>3?44:56}" text-anchor="middle" dominant-baseline="central">${track==='big'?'🦊':'🐥'}</text>`;
head.innerHTML=h;
$('stars').textContent='⭐'.repeat(visited())+'☆'.repeat(total-visited());
}
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
function cellAt(e){
const b=grid.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
if(x<0||y<0||x>=b.width||y>=b.height)return null;
return[Math.floor(y/b.height*n),Math.floor(x/b.width*n)];
}
function enter(cell){
if(!cell||done)return;
const[r,c]=cell,key=r*n+c;
if(!path.length){if(same(cell,cur.p[0])){path.push(cell);hint=null;sfx.dot();say(spoken(1));draw()}return}
const last=path[path.length-1];
if(same(last,cell))return;
if(path.length>1&&same(path[path.length-2],cell)){path.pop();sfx.back();draw();return}
if(Math.abs(last[0]-r)+Math.abs(last[1]-c)!==1||path.some(p=>same(p,cell)))return;
if(wp[key]&&wp[key]!==visited()+1){board.classList.remove('shake');void board.offsetWidth;board.classList.add('shake');track==='big'?sfx.bad():sfx.back();say(spoken(visited()+1));return}
path.push(cell);hint=null;if(wp[key]){sfx.dot();say(spoken(wp[key]))}else sfx.step();draw();
if(path.length===n*n)win();
}
board.addEventListener('pointerdown',e=>{
if(done)return;const cell=cellAt(e);if(!cell)return;
board.setPointerCapture(e.pointerId);drag=true;{const wk=wp[cell[0]*n+cell[1]];if(wk)say(spoken(wk))}
const i=path.findIndex(p=>same(p,cell));
if(i>=0&&path.length>1){path=path.slice(0,i+1);draw()}else enter(cell);
});
board.addEventListener('pointermove',e=>{if(drag)enter(cellAt(e))});
['pointerup','pointercancel'].forEach(t=>board.addEventListener(t,()=>drag=false));
function win(){
done=true;drag=false;sfx.win();setTimeout(()=>say('Hooray! You did it!'),700);
$('next').textContent=lv===TRACKS[track].length-1?'Home':'Next';
setTimeout(()=>{$('win').classList.add('show');
const e=['⭐','🎈','🌈','🦋','🌸',track==='big'?'🦊':'🐥'];
for(let i=0;i<22;i++){const s=document.createElement('span');s.className='pop';s.textContent=e[i%e.length];
s.style.left=Math.random()*95+'vw';s.style.animationDuration=(2+Math.random()*2)+'s';s.style.animationDelay=Math.random()*.6+'s';
document.body.appendChild(s);setTimeout(()=>s.remove(),5000)}},500);
}
$('next').onclick=()=>{$('win').classList.remove('show');if(mode!=='dots')return shapesNext();lv===TRACKS[track].length-1?home():load(lv+1)};
$('reset').onclick=()=>load(lv);
$('home-btn').onclick=home;
$('hint').onclick=()=>{let m=0;while(m<path.length&&same(path[m],cur.p[m]))m++;path=path.slice(0,m);hint=cur.p[m]||null;draw()};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'Sound is off':'Sound is on');if(muted)try{speechSynthesis.cancel()}catch(e){}};
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{sfx.tap();if(b.id!=='mute'&&b.id!=='test')say(b.textContent.replace(/[^A-Za-z0-9\- ]/g,'').replace('2-3','2 to 3').replace('4-6','4 to 6').trim())}));
document.addEventListener('pointerdown',()=>{try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}},{once:true});
$('test').onclick=()=>say('Hello! One, two, three.');$('vw').onclick=()=>{$('vw').hidden=true};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{track=b.dataset.t;$('home').hidden=true;$('menu').hidden=false});
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>b.dataset.g==='dots'?start(track):b.dataset.g==='count'?startCount():startShapes(b.dataset.g));
$('menu-home').onclick=home;$('s-home').onclick=home;$('s-reset').onclick=()=>mode==='sort'?loadSort(rd):loadRound(rd);$('c-home').onclick=home;
const SH={circle:['#FF6B6B','<circle cx="50" cy="50" r="40"/>'],square:['#4DA3FF','<rect x="12" y="12" width="76" height="76" rx="10"/>'],
triangle:['#4CC38A','<polygon points="50,10 92,86 8,86" stroke-linejoin="round"/>'],
star:['#FFD23F','<polygon points="50,8 61,38 93,38 67,57 77,89 50,70 23,89 33,57 7,38 39,38" stroke-linejoin="round"/>'],
heart:['#FF8FD0','<path d="M50 86C10 58 6 30 26 20C38 14 48 22 50 30C52 22 62 14 74 20C94 30 90 58 50 86Z"/>']};
const ROUNDS={
little:[['circle','square'],['circle','square','triangle'],['square','triangle','circle']],
big:[['circle','square','triangle'],['star','heart','circle','triangle'],['square','star','heart','triangle','circle']]};
let rd=0,left=0,tot=0,dp=null;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const svgOf=(k,f)=>`<svg viewBox="0 0 100 100" width="100%" height="100%" ${f?`fill="${SH[k][0]}" stroke="#fff" stroke-width="4"`:'fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="7 6" opacity=".55"'}>${SH[k][1]}</svg>`;
const updStars=()=>$('stars2').textContent='⭐'.repeat(tot-left)+'☆'.repeat(left);
function startShapes(g){mode=g;$('menu').hidden=true;$('shapes').hidden=false;$('sp').textContent=g==='sort'?'Drag each one to its color!':'Drag each shape to its home!';g==='sort'?loadSort(0):loadRound(0)}
function startCount(){mode='count';$('menu').hidden=true;$('count').hidden=false;loadCount(0)}
function loadRound(i){
rd=i;const set=ROUNDS[track][i];tot=left=set.length;
document.documentElement.style.setProperty('--sz',Math.min(120,Math.floor(innerWidth*.86/set.length)-12)+'px');
$('targets').innerHTML=shuf(set).map(k=>`<div class="slot" data-s="${k}">${svgOf(k,false)}</div>`).join('');
$('tray').innerHTML=shuf(set).map(k=>`<div class="piece" data-s="${k}">${svgOf(k,true)}</div>`).join('');
updStars();
}
const back=p=>{p.style.transition='transform .25s';p.style.transform='';p.style.zIndex=''};
$('tray').addEventListener('pointerdown',e=>{const p=e.target.closest('.piece');if(!p)return;
tone(520,.08,'triangle');p.setPointerCapture(e.pointerId);dp={p,x:e.clientX,y:e.clientY,m:false};p.style.zIndex=10;p.style.transition='none'});
$('tray').addEventListener('pointermove',e=>{if(!dp)return;const dx=e.clientX-dp.x,dy=e.clientY-dp.y;
if(Math.abs(dx)+Math.abs(dy)>8)dp.m=true;dp.p.style.transform=`translate(${dx}px,${dy}px) scale(1.1)`});
function endDrag(){
if(!dp)return;const{p,m}=dp;dp=null;
if(!m){say(p.dataset.s);back(p);return}
const r=p.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
const slot=[...document.querySelectorAll('.slot')].find(q=>{const b=q.getBoundingClientRect();return cx>b.left&&cx<b.right&&cy>b.top&&cy<b.bottom});
if(slot&&!slot.classList.contains('full')&&slot.dataset.s===p.dataset.s){
if(mode==='sort')slot.querySelector('.in').insertAdjacentHTML('beforeend',`<span>${p.dataset.e}</span>`);else{slot.classList.add('full');slot.innerHTML=svgOf(p.dataset.s,true)}p.remove();sfx.dot();say(p.dataset.s);left--;updStars();if(!left)shapesWin()}
else{back(p);slot&&track==='big'?sfx.bad():sfx.back()}
}
['pointerup','pointercancel'].forEach(t=>$('tray').addEventListener(t,endDrag));
const rounds=()=>mode==='sort'?SR:mode==='count'?CR:ROUNDS;
function shapesWin(){win();$('next').textContent=rd===rounds()[track].length-1?'Home':'Next'}
function shapesNext(){rd===rounds()[track].length-1?home():mode==='sort'?loadSort(rd+1):mode==='count'?loadCount(rd+1):loadRound(rd+1)}
const COL={red:{c:'#FF6B6B',i:['🍎','🍓','🚒','🌹']},blue:{c:'#4DA3FF',i:['🐳','💧','🦋','🧢']},green:{c:'#4CC38A',i:['🐸','🥦','🌲','🐢']},yellow:{c:'#F2A900',i:['🍌','🌻','🍋','⭐']}};
const SR={little:[['red','blue'],['green','yellow'],['red','green','blue']],big:[['red','blue','green'],['yellow','red','blue','green'],['green','yellow','blue','red']]};
function loadSort(i){
rd=i;const cols=SR[track][i],k=track==='big'?3:2;
const items=cols.flatMap(c=>shuf(COL[c].i).slice(0,k).map(e=>({c,e})));tot=left=items.length;
const R=document.documentElement.style;R.setProperty('--sz',Math.min(130,Math.floor(innerWidth*.86/cols.length)-12)+'px');R.setProperty('--psz',(track==='big'?60:80)+'px');
$('targets').innerHTML=cols.map(c=>`<div class="slot bk" data-s="${c}" style="--c:${COL[c].c}"><b class="bl">${c}</b><div class="in"></div></div>`).join('');
$('tray').innerHTML=shuf(items).map(o=>`<div class="piece em" data-s="${o.c}" data-e="${o.e}">${o.e}</div>`).join('');
updStars();
}
const CR={little:[0,0,0,0,0],big:[0,0,0,0,0]};
const CI={'🍎':'apples','🐟':'fish','⭐':'stars','🐥':'chicks','🍓':'strawberries','🦋':'butterflies','🚗':'cars','🌸':'flowers'};
let cn=0,lastC=0,cc=0,cname='';
function loadCount(i){
rd=i;const mx=track==='big'?(i<2?6:10):(i<3?3:5);
do{cn=1+Math.floor(Math.random()*mx)}while(cn===lastC);lastC=cn;cc=0;
const e=shuf(Object.keys(CI))[0],fs=cn<=3?4.5:cn<=6?3.3:2.7;cname=CI[e];
$('cq').textContent=`How many ${cname}? Tap each one to count!`;
$('cbox').innerHTML=Array.from({length:cn},()=>`<button class="ci" style="font-size:${fs}rem" aria-label="${cname}">${e}</button>`).join('');
const o=new Set([cn]),lim=track==='big'?10:5;while(o.size<(track==='big'?4:3))o.add(1+Math.floor(Math.random()*lim));
$('cans').innerHTML=shuf([...o]).map(v=>`<button data-n="${v}">${v}</button>`).join('');
$('cstars').textContent='⭐'.repeat(i)+'☆'.repeat(5-i);
say(`How many ${cname}?`);
}
$('cbox').addEventListener('click',e=>{const b=e.target.closest('.ci');if(!b||b.classList.contains('on'))return;b.classList.add('on');cc++;tone(520+cc*40,.12,'triangle');say(String(cc))});
$('cans').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.classList.contains('yes'))return;
tone(300+ +b.dataset.n*45,.15,'triangle');
if(+b.dataset.n===cn){b.classList.add('yes');$('cans').querySelectorAll('button').forEach(x=>x.style.pointerEvents='none');sfx.dot();say(`${cn} ${cname}! Great job!`);
setTimeout(()=>{if($('count').hidden)return;rd===4?countWin():loadCount(rd+1)},1800)}
else{b.classList.add('no');tone(300+ +b.dataset.n*45,.15,'triangle');say(b.dataset.n+'. Try again')}});
function countWin(){win();$('next').textContent='Home'}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
